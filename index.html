<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- Linking external CSS file (Part 4) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1: Header Section -->
    <header id="main-header">
        <h1>My Budget Tracker</h1>
        <p class="subtitle">Track your income and expenses in one place.</p>
    </header>

    <main>
        <!-- Part 2: Add Expense Section -->
        <section id="add-expense-section" class="card">
            <h2>Add Expense</h2>
            <form class="expense-form">
                <div class="input-group">
                    <label for="expense-name">Expense Name:</label>
                    <input type="text" id="expense-name" placeholder="e.g., Groceries">
                </div>

                <div class="input-group">
                    <label for="expense-amount">Amount ($):</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 50.00" step="0.01">
                </div>

                <div class="input-group">
                    <label for="expense-category">Category:</label>
                    <select id="expense-category">
                        <option value="food">Food</option>
                        <option value="transport">Transport</option>
                        <option value="utilities">Utilities</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <button type="button" class="btn">Add Expense</button>
            </form>
        </section>

        <!-- Part 3: Expense List Placeholder Section -->
        <section id="expenses-list-section" class="card">
            <h2>Your Expenses</h2>
            <p class="placeholder-text">No expenses yet.</p>
        </section>
    </main>

</body>
</html>
